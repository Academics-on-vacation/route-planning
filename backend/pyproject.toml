[project]
name = "route-planning-backend"
version = "0.1.0"
description = "FastAPI backend for the route planning prototype."
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.30.0",
    "fastapi==0.116.1",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.22",
    "requests==2.34.2",
    "sqlalchemy[asyncio]==2.0.43",
    "uvicorn[standard]==0.35.0",
    "yandex_geocoder==3.0.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pre-commit==4.3.0",
    "pytest==8.4.1",
    "ruff==0.12.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# Ruff's formatter owns line wrapping; some string literals cannot be wrapped.
ignore = ["E501"]
