services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-route_planning}
      POSTGRES_USER: ${POSTGRES_USER:-route_planning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - database
      - grafana-datasources-net
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  migrate:
    build:
      context: ./backend
    environment: &database-environment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-route_planning}
      DB_USER: ${POSTGRES_USER:-route_planning}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  backend:
    build:
      context: ./backend
    environment:
      <<: *database-environment
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      TWOGIS_API_KEY: ${TWOGIS_API_KEY:-}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - backend
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2.0"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

volumes:
  postgres-data:

networks:
  backend: {}
  database: {}
  grafana-datasources-net:
    external: true
