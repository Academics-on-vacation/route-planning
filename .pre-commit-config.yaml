minimum_pre_commit_version: '4.2.0'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: frontend-format
        name: frontend format
        entry: make -C frontend format
        language: system
        files: ^frontend/(src/.*|index\.html|vite\.config\.js)$
        pass_filenames: false
      - id: backend-format
        name: backend format
        entry: make -C backend format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
