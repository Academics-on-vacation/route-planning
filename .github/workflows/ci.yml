name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: route_planning_test
          POSTGRES_USER: route_planning_test
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U route_planning_test -d route_planning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_MIGRATION_TESTS: '1'
      RUN_IMPORT_TESTS: '1'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: route_planning_test
      DB_USER: route_planning_test
      DB_PASSWORD: migration-test-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
          enable-cache: true
      - run: make install
      - run: make migrate
      - run: make check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make check

  deploy:
    name: Deploy to VM
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            make up
